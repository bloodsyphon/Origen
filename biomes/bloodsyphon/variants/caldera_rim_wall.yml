id: BLOODSYPHON_CALDERA_RIM_WALL
type: BIOME
vanilla: minecraft:jagged_peaks
color: 0xb8c6d6
extends: [ CARVING_LAND, BASE ]

colors:
  sky: 0xb8d8ff
  fog: 0xd8e8f5
  grass: 0x6f9d63
  foliage: 0x6f9d63
  water: 0x5c93bd

vars: &variables
  base: 74
  skirtHeight: 42
  coneHeight: 218
  summitHeight: 30
  cliffNoiseStrength: 13

terrain:
  sampler:
    dimensions: 3
    type: EXPRESSION
    variables: *variables
    expression: |
      -y + base
      + skirt(x, z) * skirtHeight
      + clamp(coneShape(x, z), 0, 1)^1.22 * coneHeight
      + clamp(summitPush(x, z), 0, 1)^2.6 * summitHeight
      + strata(x, y * 1.5, z) * cliffNoiseStrength * lerp(y, 90, 0.18, 275, 1)
    functions:
      clamp:
        arguments: [x, a, b]
        expression: min(max(x, a), b)
    samplers:
      skirt:
        dimensions: 2
        type: PROBABILITY
        sampler:
          type: FBM
          octaves: 3
          gain: 0.45
          lacunarity: 2.1
          sampler:
            type: OPEN_SIMPLEX_2S
            frequency: 0.0012
            salt: 70100
      coneShape:
        dimensions: 2
        type: DOMAIN_WARP
        amplitude: 42
        warp:
          type: OPEN_SIMPLEX_2S
          frequency: 0.0026
          salt: 70101
        sampler:
          dimensions: 2
          type: LINEAR
          min: 1
          max: 0.08
          sampler:
            type: CELLULAR
            distance: Euclidean
            return: Distance
            frequency: 0.0028
            jitter: 0.45
            salt: 70102
      summitPush:
        dimensions: 2
        type: DOMAIN_WARP
        amplitude: 24
        warp:
          type: OPEN_SIMPLEX_2S
          frequency: 0.004
          salt: 70103
        sampler:
          dimensions: 2
          type: LINEAR
          min: 1
          max: 0.35
          sampler:
            type: CELLULAR
            distance: Euclidean
            return: Distance
            frequency: 0.0028
            jitter: 0.45
            salt: 70102
      strata:
        dimensions: 3
        type: OPEN_SIMPLEX_2S
        frequency: 0.026
        salt: 70104

slant:
  - threshold: 0.25
    palette:
      - ROCKY_SLANT_DARK: 319
      - << meta.yml:palette-bottom
  - threshold: 0.72
    palette:
      - BLOCK:minecraft:stone: 319
      - << meta.yml:palette-bottom

palette:
  - SNOW: 319
  - GRASS_SNOW_MIX: 176
  - GRASS: 96
  - SAND: 64
  - << meta.yml:palette-bottom

features:
  preprocessors:
    - POWDER_SNOW_DEPOSITS
  slabs:
    - SNOW_LAYERS
  landforms:
    - MOSSY_BOULDERS
    - SMALL_MOSSY_BOULDER_PATCHES
  trees:
    - COLD_MOUNTAIN_TREES
  flora:
    - GRASS_SPARSE
  postprocessors:
    - TREE_SNOW
