id: BLOODSYPHON_CALDERA_STEEP_PEAKS
type: BIOME
vanilla: minecraft:frozen_peaks
color: 0xd8e8f5
extends: [ CARVING_LAND, BASE ]

colors:
  sky: 0xcfe6ff
  fog: 0xe7eff7
  grass: 0x789c68
  foliage: 0x789c68
  water: 0x5c93bd

vars: &variables
  base: 78
  shoulderHeight: 68
  peakHeight: 220
  summitHeight: 28
  cliffRoughness: 22

terrain:
  sampler:
    dimensions: 3
    type: EXPRESSION
    variables: *variables
    expression: |
      -y + base
      + shoulder(x, z) * shoulderHeight
      + clamp(peakMass(x, z), 0, 1)^1.75 * peakHeight
      + clamp(summits(x, z), 0, 1)^3.2 * summitHeight
      + cliffNoise(x, y * 1.6, z) * cliffRoughness * lerp(y, 90, 0.1, 285, 1)
    functions:
      clamp:
        arguments: [x, a, b]
        expression: min(max(x, a), b)
    samplers:
      shoulder:
        dimensions: 2
        type: PROBABILITY
        sampler:
          type: DOMAIN_WARP
          amplitude: 36
          warp:
            type: OPEN_SIMPLEX_2S
            frequency: 0.0035
            salt: 70201
          sampler:
            type: FBM
            octaves: 3
            gain: 0.44
            lacunarity: 2.2
            sampler:
              type: OPEN_SIMPLEX_2S
              frequency: 0.0016
              salt: 70202
      peakMass:
        dimensions: 2
        type: DOMAIN_WARP
        amplitude: 42
        warp:
          type: OPEN_SIMPLEX_2S
          frequency: 0.004
          salt: 70203
        sampler:
          type: RIDGED
          octaves: 5
          gain: 0.5
          lacunarity: 2.05
          sampler:
            type: OPEN_SIMPLEX_2S
            frequency: 0.0024
            salt: 70204
      summits:
        dimensions: 2
        type: FBM
        octaves: 2
        gain: 0.5
        lacunarity: 2.4
        sampler:
          type: OPEN_SIMPLEX_2S
          frequency: 0.007
          salt: 70205
      cliffNoise:
        dimensions: 3
        type: FBM
        octaves: 3
        gain: 0.48
        lacunarity: 2.1
        sampler:
          type: OPEN_SIMPLEX_2S
          frequency: 0.024
          salt: 70206

slant:
  - threshold: 0.2
    palette:
      - FROZEN_CLIFF: 319
      - << meta.yml:palette-bottom
  - threshold: 0.68
    palette:
      - ICE_STONE_MIX_LIGHT: 319
      - << meta.yml:palette-bottom

palette:
  - SNOW: 319
  - GRASS_SNOW_MIX: 154
  - GRASS: 92
  - SAND: 64
  - << meta.yml:palette-bottom

features:
  preprocessors:
    - POWDER_SNOW_DEPOSITS
  slabs:
    - SNOW_LAYERS
  landforms:
    - GRANITE_BOULDERS
    - SMALL_GRANITE_BOULDER_PATCHES
  trees:
    - COLD_MOUNTAIN_TREES
  flora:
    - GRASS_SPARSE
  postprocessors:
    - TREE_SNOW
