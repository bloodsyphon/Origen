id: BLOODSYPHON_CALDERA_STEEP_PEAKS
type: BIOME
vanilla: minecraft:frozen_peaks
color: 0xd8e8f5
extends: [ CARVING_LAND, BASE ]

colors:
  sky: 0xcfe6ff
  fog: 0xe7eff7
  grass: 0x789c68
  foliage: 0x789c68
  water: 0x5c93bd

vars: &variables
  base: 78
  apronHeight: 50
  coneHeight: 216
  summitHeight: 32
  cliffRoughness: 14

terrain:
  sampler:
    dimensions: 3
    type: EXPRESSION
    variables: *variables
    expression: |
      -y + base
      + apron(x, z) * apronHeight
      + clamp(coneShape(x, z), 0, 1)^1.34 * coneHeight
      + clamp(summit(x, z), 0, 1)^2.8 * summitHeight
      + cliffNoise(x, y * 1.6, z) * cliffRoughness * lerp(y, 95, 0.1, 285, 1)
    functions:
      clamp:
        arguments: [x, a, b]
        expression: min(max(x, a), b)
    samplers:
      apron:
        dimensions: 2
        type: PROBABILITY
        sampler:
          type: DOMAIN_WARP
          amplitude: 36
          warp:
            type: OPEN_SIMPLEX_2S
            frequency: 0.0035
            salt: 70201
          sampler:
            type: FBM
            octaves: 3
            gain: 0.44
            lacunarity: 2.2
            sampler:
              type: OPEN_SIMPLEX_2S
              frequency: 0.0013
              salt: 70202
      coneShape:
        dimensions: 2
        type: DOMAIN_WARP
        amplitude: 36
        warp:
          type: OPEN_SIMPLEX_2S
          frequency: 0.003
          salt: 70203
        sampler:
          dimensions: 2
          type: LINEAR
          min: 1
          max: 0.06
          sampler:
            type: CELLULAR
            distance: Euclidean
            return: Distance
            frequency: 0.0036
            jitter: 0.5
            salt: 70204
      summit:
        dimensions: 2
        type: DOMAIN_WARP
        amplitude: 22
        warp:
          type: OPEN_SIMPLEX_2S
          frequency: 0.005
          salt: 70205
        sampler:
          dimensions: 2
          type: LINEAR
          min: 1
          max: 0.34
          sampler:
            type: CELLULAR
            distance: Euclidean
            return: Distance
            frequency: 0.0036
            jitter: 0.5
            salt: 70204
      cliffNoise:
        dimensions: 3
        type: FBM
        octaves: 3
        gain: 0.48
        lacunarity: 2.1
        sampler:
          type: OPEN_SIMPLEX_2S
          frequency: 0.024
          salt: 70206

slant:
  - threshold: 0.2
    palette:
      - FROZEN_CLIFF: 319
      - << meta.yml:palette-bottom
  - threshold: 0.68
    palette:
      - ICE_STONE_MIX_LIGHT: 319
      - << meta.yml:palette-bottom

palette:
  - SNOW: 319
  - GRASS_SNOW_MIX: 154
  - GRASS: 92
  - SAND: 64
  - << meta.yml:palette-bottom

features:
  preprocessors:
    - POWDER_SNOW_DEPOSITS
  slabs:
    - SNOW_LAYERS
  landforms:
    - GRANITE_BOULDERS
    - SMALL_GRANITE_BOULDER_PATCHES
  trees:
    - COLD_MOUNTAIN_TREES
  flora:
    - GRASS_SPARSE
  postprocessors:
    - TREE_SNOW
